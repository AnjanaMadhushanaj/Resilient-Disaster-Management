services:
  api:
    build: ./api
    restart: always
    ports:
      - "3000:3000"

  dashboard:
    build:
      context: ./dashboard
      # NEXT_PUBLIC_* variables are inlined during `next build`, so these have to
      # reach the image as build args rather than runtime environment variables.
      #
      # Both come from the .env file the pipeline writes on the instance. They are
      # unset locally, so this falls back to localhost for `docker compose up` and
      # the map shows its "token not set" panel.
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:3000
        NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    restart: always
    ports:
      # 80 serves the plain http://<host> URL; 3001 keeps the previous demo URL working.
      - "80:3000"
      - "3001:3000"
    depends_on:
      - api

  edge:
    build: ./edge
    restart: always
    environment:
      # Server-to-server call, so it uses the Compose service name, not the public IP.
      API_URL: http://api:3000
    depends_on:
      - api
