services:
  api:
    build: ./api
    restart: always
    ports:
      - "3000:3000"

  dashboard:
    build:
      context: ./dashboard
      # NEXT_PUBLIC_* variables are inlined during `next build`, so the public API
      # URL has to reach the image as a build arg rather than a runtime variable.
      #
      # PUBLIC_HOST comes from the .env file the pipeline writes on the instance.
      # Unset locally, so this falls back to localhost for `docker compose up`.
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:3000
    restart: always
    ports:
      # 80 serves the plain http://<host> URL; 3001 keeps the previous demo URL working.
      - "80:3000"
      - "3001:3000"
    depends_on:
      - api

  edge:
    build: ./edge
    restart: always
    environment:
      # Server-to-server call, so it uses the Compose service name, not the public IP.
      API_URL: http://api:3000
    depends_on:
      - api
